name: Build Monsterbound Mobile Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Android project
        shell: bash
        run: |
          set -euxo pipefail
          test -f Monsterbound_Pocket_Wilds_COLOR_PHONE_RELEASE.zip
          rm -rf /tmp/monsterbound
          mkdir -p /tmp/monsterbound
          unzip -q -o Monsterbound_Pocket_Wilds_COLOR_PHONE_RELEASE.zip -d /tmp/monsterbound
          cp -a /tmp/monsterbound/. .
          test -f app/src/main/assets/index.html
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/monsterbound/pocketwilds/MainActivity.java

      - name: Repair mobile HTML shell
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/repair_mobile_html.py
          test -f app/src/main/assets/index.html

      - name: Optimize Android WebView
        shell: bash
        run: |
          set -euxo pipefail
          cat > app/src/main/java/com/monsterbound/pocketwilds/MainActivity.java <<'JAVA'
package com.monsterbound.pocketwilds;

import android.app.Activity;
import android.graphics.Color;
import android.os.Bundle;
import android.view.View;
import android.view.Window;
import android.view.WindowManager;
import android.webkit.WebChromeClient;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.widget.FrameLayout;

public final class MainActivity extends Activity {
    private WebView web;

    @Override protected void onCreate(Bundle state) {
        super.onCreate(state);
        requestWindowFeature(Window.FEATURE_NO_TITLE);
        getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
        getWindow().setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_NOTHING);
        getWindow().setStatusBarColor(Color.BLACK);
        getWindow().setNavigationBarColor(Color.BLACK);

        web = new WebView(this);
        web.setBackgroundColor(Color.BLACK);
        web.setOverScrollMode(View.OVER_SCROLL_NEVER);
        web.setVerticalScrollBarEnabled(false);
        web.setHorizontalScrollBarEnabled(false);
        web.setWebViewClient(new WebViewClient());
        web.setWebChromeClient(new WebChromeClient());

        WebSettings s = web.getSettings();
        s.setJavaScriptEnabled(true);
        s.setDomStorageEnabled(true);
        s.setAllowFileAccess(true);
        s.setAllowContentAccess(false);
        s.setBuiltInZoomControls(false);
        s.setDisplayZoomControls(false);
        s.setSupportZoom(false);
        s.setTextZoom(100);
        s.setUseWideViewPort(false);
        s.setLoadWithOverviewMode(false);
        s.setCacheMode(WebSettings.LOAD_DEFAULT);

        FrameLayout root = new FrameLayout(this);
        root.setBackgroundColor(Color.BLACK);
        root.addView(web, new FrameLayout.LayoutParams(-1, -1));
        setContentView(root);
        hideSystemUi();
        web.loadUrl("file:///android_asset/index.html");
    }

    private void hideSystemUi() {
        getWindow().getDecorView().setSystemUiVisibility(
            View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
            View.SYSTEM_UI_FLAG_FULLSCREEN |
            View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
            View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
            View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
            View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
    }

    @Override public void onWindowFocusChanged(boolean hasFocus) {
        super.onWindowFocusChanged(hasFocus);
        if (hasFocus) hideSystemUi();
    }

    @Override public void onBackPressed() {
        if (web != null) web.evaluateJavascript(
            "if(typeof back==='function'){back();}", null);
        else super.onBackPressed();
    }

    @Override protected void onPause() {
        if (web != null) web.onPause();
        super.onPause();
    }

    @Override protected void onResume() {
        super.onResume();
        if (web != null) web.onResume();
    }

    @Override protected void onDestroy() {
        if (web != null) {
            web.stopLoading();
            web.loadUrl("about:blank");
            web.removeAllViews();
            web.destroy();
            web = null;
        }
        super.onDestroy();
    }
}
JAVA

          python3 - <<'PY'
from pathlib import Path
p = Path("app/src/main/AndroidManifest.xml")
s = p.read_text(encoding="utf-8")
if "android:hardwareAccelerated" not in s:
    s = s.replace("<application ", '<application android:hardwareAccelerated="true" ', 1)
s = s.replace('android:windowSoftInputMode="adjustResize"', 'android:windowSoftInputMode="adjustNothing"')
if 'android:windowSoftInputMode=' not in s:
    s = s.replace('<activity android:name=".MainActivity"', '<activity android:name=".MainActivity" android:windowSoftInputMode="adjustNothing"', 1)
p.write_text(s, encoding="utf-8")
