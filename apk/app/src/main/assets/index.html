 rect(88,17,62,5,C.d);rect(90,18,58,3,'#ff8c94');rect(90,18,58*Math.max(0,b.enemy.hp/b.enemy.max),3,C.green);
 sprite(108,43,false,e.type);sprite(32,67,false,ms.type);
 txt(ms.n.toUpperCase(),6,96,6,C.d);txt('Lv'+me.lv,58,96,6,C.d);
 rect(7,101,70,5,C.d);rect(9,102,66,3,'#ff8c94');rect(9,102,66*(me.hp/me.max),3,C.green);txt('HP '+me.hp+'/'+me.max,7,116,6,C.d);
 box(3,120,154,21);
 if(b.menu==='moves'){txt('A:'+moves[me.moves[0]].n,8,129,5,C.d);txt('B:'+moves[me.moves[1]].n,8,137,5,C.d);txt('Y: switch',96,129,5,C.d)}
 else if(b.menu==='switch'){txt('1-6: choose creature',8,130,6,C.d);txt('B: back',8,138,6,C.d)}
 else {txt('A FIGHT   Y SWITCH',8,130,6,C.d);txt('B CAPTURE  X RUN',8,138,6,C.d)}
 if(b.message)txt(b.message,78,130,5,C.d);
}
function storyDraw(){
 txt('WILDLIFE CHECKLIST',7,15,7,C.d);
 txt((S.badges>=4?'✓':'□')+' Four badges',7,28,6,C.d);
 txt((S.flags.warden?'✓':'□')+' Warden trial',7,39,6,C.d);
 txt((S.caught.filter(Boolean).length>=150?'✓':'□')+' 150 species',7,50,6,C.d);
 txt((S.area==='hollow'||S.flags.warden?'✓':'□')+' Moonlit Hollow',7,61,6,C.d);

 clear();border();box(5,15,150,110);
 (S.lines||['...']).forEach((v,i)=>txt(v,10,34+i*13,7,C.d));txt('A: continue',55,119,6,C.d);
}
function menuDraw(){
 clear();border();txt('TRAINER MENU',9,14,9,C.d);
 txt('Party '+S.party.length+'/6   Box '+S.box.length,9,28,7,C.d);
 txt('Caught '+Object.keys(S.caught).length+'/150',9,40,7,C.d);
 txt('$'+S.money+'  Potions '+S.potions+'  Caps '+S.capsules,9,52,7,C.d);
 txt('Badges '+S.badges+'/4',9,64,7,C.d);
 S.party.slice(0,4).forEach((q,i)=>txt((i+1)+'. '+monsters[q.sid].n+' Lv'+q.lv+' HP '+q.hp+'/'+q.max,9,77+i*9,6,C.d));
 txt('A potion   Y box   B close',9,118,6,C.d);
}

function partyScreen(){
 S.mode='party';
}
function partyDraw(){
 clear();border();txt(S.boxMode?'BOX':'PARTY',8,13,9,C.d);
 if(S.boxMode){
   if(!S.box.length)txt('The box is empty.',8,35,6,C.d);
   S.box.slice(0,6).forEach((q,i)=>{
    const y=30+i*16;box(5,y-7,150,14);
    txt((i+1)+'. '+monsters[q.sid].n,9,y+2,6,C.d);
    txt('Lv'+q.lv,76,y+2,5,C.d);txt(q.hp+'/'+q.max,104,y+2,5,C.d);
   });
   txt('1-6 move to party • Y party • B back',8,134,5,C.d);
 }else{
   S.party.forEach((q,i)=>{
    const y=32+i*14;box(5,y-6,150,12);
    txt((i+1)+'. '+monsters[q.sid].n,9,y+2,6,C.d);
    txt('Lv'+q.lv,70,y+2,5,C.d);txt(q.hp+'/'+q.max,96,y+2,5,C.d);
    txt(q.sid===active().sid?'ACTIVE':'',127,y+2,4,C.m);
   });
   txt('Box: '+S.box.length+' stored',8,120,6,C.d);
   txt('1-6 reorder • Y box • H heal • B back',8,134,5,C.d);
 } 
}

function collectionDraw(){
 clear();border();txt('FIELD GUIDE',8,13,9,C.d);
 const page=S.guidePage||0,start=page*30;
 for(let i=0;i<30&&start+i<monsters.length;i++){
  const id=start+i,s=monsters[id],caught=S.caught[id],seen=S.seen[id];
  const x=(i%3)*53+4,y=Math.floor(i/3)*12+24;
  txt(String(id+1).padStart(3,'0'),x,y,5,C.d);
  txt(caught?s.n:(seen?'?????':'-----'),x+18,y,5,C.d);
  if(caught)txt(s.type,x+18,y+6,4,C.m);
 }
 txt(S.flags.complete150?'ALL 150 CAPTURED!':'B close  ◀/▶ page',43,139,6,C.d);
}
function message(lines){S.lines=lines;S.mode='story'}
function beginBattle(id,trainer=false,name=''){
 const lv=Math.max(2,active().lv+(trainer?1:Math.floor(Math.random()*3)-1));
 S.seen[id]=true;
 const ids=trainer?(trainerTeams[name]||[id]):[id];
 const team=ids.map((sid,i)=>buildCreature(sid,Math.max(2,lv+i)));
 S.battle={trainer,trainerName:name,team,slot:0,enemy:team[0],menu:'main',message:trainer?name+' challenges you!':'A wild '+monsters[id].n+' appeared!'};
 S.mode='battle';
}
function wildEncounter(){
 const list=encounterTables[S.area]||encounterTables.route1;
 if(!list)return;
 const id=list[Math.floor(Math.random()*list.length)];
 beginBattle(id,false);
}
function hit(att,move,def){
 const mult=(typeBonus[move.t]&&typeBonus[move.t][monsters[def.sid].type])||1;
 const variance=.85+Math.random()*.3;
 return Math.max(1,Math.floor((att.atk+att.lv*1.5+move.p)*mult*variance/Math.max(1,def.def*.65)));
}

function partyDefeated(){
 return !S.party.some(q=>q.hp>0);
}
function rescueTeam(){
 S.party.forEach(q=>q.hp=q.max);
 S.area='town';S.x=4;S.y=6;
 S.money=Math.max(0,S.money-25);
 S.msg='Your team was rescued. $25 medical fee.';
 S.mode='map';S.battle=null;
}

function enemyAct(){
 const b=S.battle,e=b.enemy,me=active();
 const mv=moves[e.moves[Math.floor(Math.random()*e.moves.length)]];
 if(Math.random()*100>mv.a){b.message=e.n+' missed!';return}
 const d=hit(e,mv,me);me.hp=Math.max(0,me.hp-d);b.message=e.n+' used '+mv.n+'! -'+d;
 if(me.hp<=0){
  if(S.party.some(q=>q.hp>0)){b.message+=' Choose another creature.';b.menu='switch';}
  else rescueTeam()
 }
}

const evolutionMap={18:19,20:21,28:29,34:35,43:44,50:51,65:66,73:74,90:91,104:105,121:122,137:138};
function maybeEvolve(q){
 const next=evolutionMap[q.sid];
 if(next===undefined || q.lv<12) return null;
 q.sid=next;
 q.max+=6;q.hp=q.max;q.atk+=2;q.def+=2;q.spd+=2;
 S.caught[next]=true;S.seen[next]=true;
 return monsters[next].n;
}
function gainXP(q,n){
 q.xp+=n;
 let leveled=false;
 while(q.xp>=q.lv*10){q.xp-=q.lv*10;q.lv++;q.max+=3;q.hp=q.max;q.atk+=1;q.def+=1;q.spd+=1;leveled=true}
 const evolved=maybeEvolve(q);
 if(evolved) S.msg='Your creature evolved into '+evolved+'!';
 return leveled;
}
function winBattle(){
 const b=S.battle,enemy=b.enemy,me=active(),reward=8+enemy.lv*4;
 const levelled=gainXP(me,reward);S.money+=b.trainer?50+enemy.lv*10:0;
 if(b.trainer && b.slot < b.team.length-1){
   b.slot++;
   b.enemy=b.team[b.slot];
   S.seen[b.enemy.sid]=true;
   b.menu='main';
   b.message='Go, '+monsters[b.enemy.sid].n+'!';
   return;
 }
 if(b.trainer){
  S.defeated[b.trainerName]=true;
  const order=['Mira','Bram','Rook','The Warden'];
  const idx=order.indexOf(b.trainerName);
  if(idx>=0){
   const old=S.badges;
   S.badges=Math.max(S.badges,idx+1);
   if(S.badges>old){S.money+=100;S.capsules+=2;S.potions+=1;S.msg='Badge earned! +$100, +2 capsules, +1 potion.';}
 }
  if(b.trainerName==='The Warden'){
   S.flags.warden=true;
   S.money+=500;S.capsules+=10;
   message(['The Warden lowers the ancient crest.','The four badges are yours.','The Wildkeeper trial is complete!','The summit path opens beyond the old gate.','You receive $500 and 10 capsules.','FREE ROAM UNLOCKED!','The eastern summit gate now leads to Moonlit Hollow.','The Wilds are yours to explore.']);
   S.battle=null;return;
  }
 }
 b.message='Victory! +'+reward+' XP'+(levelled?' LEVEL UP!':'');
 setTimeout(()=>{S.mode='map';S.battle=null},900);
}
function useMove(slot){
 const b=S.battle,me=active(),mv=moves[me.moves[slot]];
 b.menu='main';
 if(Math.random()*100>mv.a){b.message=me.n+' missed!';enemyAct();return}
 const d=hit(me,mv,b.enemy);b.enemy.hp=Math.max(0,b.enemy.hp-d);
 const mult=(typeBonus[mv.t]&&typeBonus[mv.t][monsters[b.enemy.sid].type])||1;
 b.message=me.n+' used '+mv.n+'! -'+d+(mult>1?' SUPER!':mult<1?' weak...':'');
 if(b.enemy.hp<=0)winBattle();else enemyAct();
}
function capture(){
 const b=S.battle;
 if(b.trainer){b.message='Trainer creatures cannot be captured.';return}
 if(S.capsules<=0){b.message='No capsules left!';return}
 S.capsules--;
 const ratio=1-b.enemy.hp/b.enemy.max;
 const chance=.18+ratio*.68;
 if(Math.random()<chance){
  const q=buildCreature(b.enemy.sid,b.enemy.lv);S.caught[b.enemy.sid]=true;
  if(Object.keys(S.caught).length>=150) S.flags.complete150=true;
  if(S.party.length<6)S.party.push(q);else S.box.push(q);
  b.message='Captured '+monsters[q.sid]+'!';
  setTimeout(()=>{S.mode='map';S.battle=null},700);
 }else{b.message='It broke free!';enemyAct()}
}
function switchTo(index){
 const q=S.party[index];
 if(!q||q.hp<=0)return;
 S.party.splice(index,1);S.party.unshift(q);
 if(S.battle){S.battle.menu='main';S.battle.message=monsters[q.sid].n+' enters!';enemyAct()}
}
function battleAction(a){
 const b=S.battle;if(!b)return;
 if(partyDefeated()){rescueTeam();return;}
 if(a==='fight')b.menu='moves';
 else if(a==='capture')capture();
 else if(a==='run'){if(b.trainer)b.message='No escape from a trainer battle!';else{S.mode='map';S.battle=null;S.msg='Escaped.'}}
}
function interact(){
 const A=areas[S.area];
 if(A.heal&&Math.abs(S.x-A.heal[0])+Math.abs(S.y-A.heal[1])<=1){S.party.forEach(q=>q.hp=q.max);S.msg='Your whole party is healed.'}
 if(A.shop&&Math.abs(S.x-A.shop[0])+Math.abs(S.y-A.shop[1])<=1&&S.money>=20){S.money-=20;S.potions++;S.msg='Bought a potion for $20.'}
 if(A.npc&&S.x===A.npc[0]&&S.y===A.npc[1]){
  if(S.area==='town')message(['Welcome, Wildkeeper!','Walk through tall grass to find creatures.','Beat trainers to earn four badges.','Your Field Guide tracks every species.']);
  else if(S.area==='lake')message(['Azure Lake hides rare water creatures.','The next road leads into Whisper Grove.']);
  else if(S.area==='grove')message(['The grove is home to old keeper stones.','Rook guards the final road to the summit.']);
  else if(S.area==='summit')message(['The Warden awaits.','Bring a full team if you want the safest climb.','After the trial, the eastern gate opens to Moonlit Hollow.']);
  else if(S.area==='hollow')message(['Moonlit Hollow lies beyond the summit gate.','Every species can be found somewhere in the Wilds.','Complete the Field Guide if you want the ultimate Wildkeeper challenge.']);
 }
}
function move(dx,dy){
 if(S.mode==='title'){
 S.mode='map';
 message(['Welcome to the Wilds.','Every creature has its own element, strengths,','moves, and growth path.','Build a team, earn four badges, and face the Warden.']);
 return
}
 if(S.mode!=='map')return;
 let nx=S.x+dx,ny=S.y+dy,A=areas[S.area];
 if(nx<0||ny<1||nx>19||ny>16)return;
 if(nx===19&&A.exits.east){
   if(S.area==='grove'&&S.badges<3){S.msg='Three badges are required to reach Elder Summit.';return}
   S.area=A.exits.east;S.x=1;S.y=12;return
 }
 if(nx===0&&A.exits.west){S.area=A.exits.west;S.x=18;S.y=12;return}
 if(nx<1||nx>18){return}
 S.x=nx;S.y=ny;interact();
 for(const t of (A.trainers||[]))if(nx===t[0]&&ny===t[1]&&!S.defeated[t[2]]){beginBattle(t[3][0],true,t[2]);return}
 if(A.boss&&nx===A.boss[0]&&ny===A.boss[1]&&!S.flags.warden){beginBattle(A.boss[2][0],true,'The Warden');return}
 if(A.grass.some(q=>q[0]===nx&&q[1]===ny)&&Math.random()<.16)wildEncounter();
}
function action(){
 if(S.mode==='title'){S.mode='map';return}
 if(S.mode==='battle'){
  const b=S.battle;if(b.menu==='moves'){useMove(0);return}
  battleAction('fight');return;
 }
 if(S.mode==='story'){S.mode='map';return}
 if(S.mode==='menu'){
  const q=active();if(S.potions>0&&q.hp<q.max){S.potions--;q.hp=Math.min(q.max,q.hp+18);S.msg='Potion restored '+q.sid+'.'}else S.mode='map';return;
 }
 if(S.mode==='collection'){S.mode='menu';return}
 interact();
}
function back(){
 if(S.mode==='battle'){battleAction('run')}
 else if(S.mode==='menu'||S.mode==='story'||S.mode==='collection'||S.mode==='party')S.mode='map';
}
function save(){
 try{localStorage.setItem('monsterbound_full_save_backup',localStorage.getItem('monsterbound_full_save_v2')||'');
 localStorage.setItem('monsterbound_full_save_v2',JSON.stringify(S));S.msg='Game saved.'}
 catch(e){S.msg='Save unavailable.'}
}
function load(){
 try{const z=JSON.parse(localStorage.getItem('monsterbound_full_save_v2'));if(z&&z.party&&z.party[0]&&typeof z.party[0]==='object'){S=z;S.box=S.box||[];S.flags=S.flags||{};S.flags.warden=!!S.flags.warden;S.boxMode=false}}catch(e){}
}
function refreshPanels(){
 const mp=document.getElementById('menuPanel');
 mp.innerHTML='<b>TRAINER MENU</b><div class="grid"><button id="potion">Potion ('+S.potions+')</button><button id="guide">Field Guide</button><button id="box">Party / Box</button><button id="closeMenu">Close</button></div><p class="small">Badges '+S.badges+'/4 • $'+S.money+' • Caught '+Object.keys(S.caught).length+'/150</p>';
 mp.querySelector('#potion').onclick=()=>{const q=active();if(S.potions>0&&q.hp<q.max){S.potions--;q.hp=Math.min(q.max,q.hp+18)}refreshPanels()};
 mp.querySelector('#guide').onclick=()=>{document.getElementById('menuPanel').style.display='none';S.mode='collection'};
 mp.querySelector('#box').onclick=()=>{document.getElementById('menuPanel').style.display='none';S.boxMode=false;S.mode='party'};
 mp.querySelector('#closeMenu').onclick=()=>mp.style.display='none';
 const dp=document.getElementById('devPanel');
 dp.innerHTML='<b>DEV MENU</b><p class="small">Creator tools for your own game.</p><div class="grid"><label>Lv <input id="dl" type="number" value="'+active().lv+'"></label><label>Money <input id="dm" type="number" value="'+S.money+'"></label><label>Potions <input id="dp" type="number" value="'+S.potions+'"></label><label>Capsules <input id="dc" type="number" value="'+S.capsules+'"></label></div><button id="applyDev">Apply</button><button id="all">Unlock 150</button><button id="healDev">Heal All</button><button id="closeDev">Close</button>';
 dp.querySelector('#applyDev').onclick=()=>{const q=active();q.lv=Math.max(1,+document.getElementById('dl').value||1);q.max=Math.max(q.max,8+q.lv*3);q.hp=q.max;S.money=Math.max(0,+document.getElementById('dm').value||0);S.potions=Math.max(0,+document.getElementById('dp').value||0);S.capsules=Math.max(0,+document.getElementById('dc').value||0);dp.style.display='none'};
 dp.querySelector('#all').onclick=()=>{monsters.forEach((_,i)=>{S.caught[i]=true;S.seen[i]=true});S.msg='All 150 species unlocked for testing.'};
 dp.querySelector('#healDev').onclick=()=>S.party.forEach(q=>q.hp=q.max);
 dp.querySelector('#closeDev').insertAdjacentHTML('beforebegin','<button id="newGame">NEW GAME</button>');
 dp.querySelector('#newGame').onclick=()=>{if(confirm('Start a new adventure?')){localStorage.removeItem('monsterbound_full_save_v2');location.reload()}};
 dp.querySelector('#newGame').insertAdjacentHTML('afterend','<button id="restoreBackup">RESTORE BACKUP</button>');
 dp.querySelector('#restoreBackup').onclick=()=>{const b=localStorage.getItem('monsterbound_full_save_backup');if(b){localStorage.setItem('monsterbound_full_save_v2',b);location.reload()}else alert('No backup save exists yet.')};
 dp.querySelector('#closeDev').onclick=()=>dp.style.display='none';
}
function render(){
 if(S.mode==='title')title();
 else if(S.mode==='map')mapDraw();
 else if(S.mode==='battle')battleDraw();
 else if(S.mode==='menu')menuDraw();
 else if(S.mode==='collection')collectionDraw();
 else if(S.mode==='party')partyDraw();
 else storyDraw();
}
function loop(){
 render();
 const bb=document.getElementById('battleBar');
 bb.style.display=(S.mode==='battle'?'grid':'none');
 const ctx=g;
 if(S.mode==='map'){ctx.save(); if(modNight()){ctx.fillStyle='rgba(20,10,70,.24)';ctx.fillRect(0,0,c.width,c.height)} if(MOD.weather!=='clear'){ctx.fillStyle='rgba(255,255,255,.72)';ctx.font='7px monospace';ctx.fillText(MOD.weather.toUpperCase(),5,10)} ctx.restore();}
 updateModVisual();
 requestAnimationFrame(loop)
}
document.getElementById('a').onclick=action;
document.getElementById('menu').onclick=()=>{S.mode='menu';refreshPanels();document.getElementById('menuPanel').style.display='block'};
document.getElementById('save').onclick=save;
document.getElementById('load').onclick=()=>{load();S.msg='Save loaded.'};
document.getElementById('fightBtn').onclick=()=>{if(S.mode==='battle')battleAction('fight')};
document.getElementById('capBtn').onclick=()=>{if(S.mode==='battle')battleAction('capture')};
document.getElementById('switchBtn').onclick=()=>{if(S.mode==='battle')S.battle.menu='switch'};
document.getElementById('dev').onclick=()=>{refreshPanels();document.getElementById('devPanel').style.display='block'};
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let k=b.dataset.k;if(k==='up')move(0,-1);if(k==='down')move(0,1);if(k==='left')move(-1,0);if(k==='right')move(1,0);if(k==='a')action()});
document.addEventListener('keydown',e=>{
 if(['INPUT','BUTTON'].includes(document.activeElement.tagName))return;
 const k=e.key.toLowerCase();
 if(k==='arrowup'||k==='w')move(0,-1);
 if(k==='arrowdown'||k==='s')move(0,1);
 if(k==='arrowleft'||k==='a')move(-1,0);
 if(k==='arrowright'||k==='d')move(1,0);
 if(k==='enter'||k===' ')action();
 if(k==='escape')back();
 if(S.mode==='battle'&&k==='b'){
   if(S.battle.menu==='moves')useMove(1);
   else if(S.battle.menu==='switch')S.battle.menu='main';
   else battleAction('capture');
 }
 if(S.mode==='battle'&&k==='x')battleAction('run');
 if(S.mode==='battle'&&k==='y'){S.battle.menu='switch';}
 if(S.mode==='battle'&&k>='1'&&k<='6'&&S.battle.menu==='switch')switchTo(+k-1);
 if(S.mode==='collection'&&k==='arrowright'){S.guidePage=Math.min(4,(S.guidePage||0)+1)}
 if(S.mode==='collection'&&k==='arrowleft'){S.guidePage=Math.max(0,(S.guidePage||0)-1)}
 if(S.mode==='party'){
   if(k==='y'){S.boxMode=!S.boxMode;return}
   if(k>='1'&&k<='6'){
     const i=+k-1;
     if(S.boxMode){
       if(i<S.box.length&&S.party.length<6){S.party.push(S.box.splice(i,1)[0]);S.msg='Moved creature from box to party.'}
       else if(S.party.length>=6)S.msg='Party is full.'
     }else if(i<S.party.length){
       const q=S.party.splice(i,1)[0];S.party.unshift(q);S.msg='Party order updated.'
     }
   }
   if(k==='h')S.party.forEach(q=>q.hp=q.max);
 }
});
document.getElementById('timeBtn').onclick=cycleTime;
document.getElementById('weatherBtn').onclick=cycleWeather;
document.getElementById('modBtn').onclick=showModInfo;
updateModVisual();
load();
setInterval(()=>{if(typeof save==='function'&&S&&S.mode!=='title')save()},15000);
loop();
})();
</script>
