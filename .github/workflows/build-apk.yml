name: Build Monsterbound Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack phone release package
        shell: bash
        run: |
          if [ -f Monsterbound_Pocket_Wilds_COLOR_PHONE_RELEASE.zip ]; then
            unzip -o Monsterbound_Pocket_Wilds_COLOR_PHONE_RELEASE.zip -d /tmp/monsterbound
            cp -a /tmp/monsterbound/. .
          fi
          test -f app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate game JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, re.S)
          Path('/tmp/monsterbound.js').write_text('\n'.join(scripts), encoding='utf-8')
          print(f'Embedded scripts: {len(scripts)}')
          print(f'HTML bytes: {len(html.encode())}')
          PY
          node --check /tmp/monsterbound.js

      - name: Build APK and AAB
        run: gradle --no-daemon --stacktrace assembleDebug bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Monsterbound-Pocket-Wilds-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: Monsterbound-Pocket-Wilds-AAB-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30