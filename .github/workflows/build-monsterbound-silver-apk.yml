name: Build Monsterbound Silver-Style APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'apk/**'
      - '.github/workflows/build-monsterbound-silver-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Validate project
        working-directory: apk
        run: |
          test -f settings.gradle
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/monsterbound/pocketwilds/MainActivity.java
          test -f app/src/main/AndroidManifest.xml
      - name: Preflight game source
        working-directory: apk
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/assets/index.html")
          s=p.read_text(encoding="utf-8")
          assert "<script>" in s and "</script>" in s, "Missing script block"
          assert s.count("<script>") == s.count("</script>") == 1, "Unbalanced script tags"
          assert s.endswith("</body></html>"), "HTML has trailing content outside the document"
          assert "setInterval(()=>{if(typeof save==='function'" in s, "Autosave hook missing"
          assert "MONSTERBOUND: POCKET WILDS" in s, "Game title missing"
          assert "150 CREATURES" in s, "150-creature marker missing"
          print("HTML preflight: PASS")
          PY
      - name: Build debug APK
        working-directory: apk
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK exists
        run: |
          test -s apk/app/build/outputs/apk/debug/app-debug.apk
          ls -lh apk/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Monsterbound-Pocket-Wilds-Silver-Style-APK
          path: apk/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
